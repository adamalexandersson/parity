name: Tests

on:
    push:
        branches: [main, develop]
    pull_request:

env:
    COMPOSER_POLICY_ADVISORIES_BLOCK: '0'

jobs:
    tests:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.2', '8.3', '8.4']
                laravel: ['11', '12']
                include:
                    - laravel: '11'
                      testbench: '9'
                    - laravel: '12'
                      testbench: '10'
                    - php: '8.3'
                      laravel: '13'
                      testbench: '11'
                    - php: '8.4'
                      laravel: '13'
                      testbench: '11'

        name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm

            - name: Install JS dependencies
              run: npm ci

            - name: Build editor bundle
              run: npm run build

            - name: Run JS tests
              run: npm test

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              run: |
                  packages=(
                    "illuminate/support:^${{ matrix.laravel }}"
                    "illuminate/console:^${{ matrix.laravel }}"
                    "illuminate/view:^${{ matrix.laravel }}"
                    "illuminate/filesystem:^${{ matrix.laravel }}"
                    "orchestra/testbench:^${{ matrix.testbench }}"
                  )
                  if [ "${{ matrix.laravel }}" = "13" ]; then
                      packages+=(
                        "pestphp/pest:^4.4"
                        "pestphp/pest-plugin-laravel:^4.0"
                      )
                  fi
                  composer require "${packages[@]}" --dev --no-interaction --no-update
                  composer update --prefer-dist --no-interaction --with-all-dependencies

            - name: Run PHP tests
              run: composer test

            - name: Run Pint
              run: vendor/bin/pint --test

            - name: Run PHPStan
              run: composer analyse

    bare-laravel:
        runs-on: ubuntu-latest
        name: Bare Laravel install
        steps:
            - uses: actions/checkout@v5
              with:
                  path: parity

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  coverage: none
                  tools: composer:v2

            - name: Create Laravel app
              run: composer create-project laravel/laravel app --prefer-dist --no-interaction

            - name: Require Parity from path
              working-directory: app
              run: |
                  composer config repositories.parity path ../parity
                  composer require adamalexandersson/parity:@dev --no-interaction

            - name: Render a component without WordPress
              working-directory: app
              run: |
                  mkdir -p app/View/Components
                  cat > app/View/Components/ParitySmoke.php <<'PHP'
                  <?php

                  namespace App\View\Components;

                  use Parity\Component;
                  use Parity\View\Component as ParityComponent;

                  class ParitySmoke extends ParityComponent
                  {
                      public function __construct(
                          public string $label = 'Hello',
                      ) {}

                      public static function compose(): array
                      {
                          return Component::make('parity-smoke', tag: 'span')
                              ->classes('inline-flex')
                              ->toSchema();
                      }
                  }
                  PHP

                  php artisan tinker --execute="config(['parity.classes.strategy' => 'passthrough']); echo Illuminate\Support\Facades\Blade::render('<x-parity-smoke label=\"Hello\" />');" \
                    | tee /tmp/parity-smoke.html

                  grep -q 'inline-flex' /tmp/parity-smoke.html
                  grep -q '<span' /tmp/parity-smoke.html
                  ! grep -qi wordpress /tmp/parity-smoke.html
