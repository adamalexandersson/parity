name: Tests

on:
    push:
        branches: [main, develop]
    pull_request:

jobs:
    tests:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.2', '8.3', '8.4']
                laravel: ['11', '12']
                include:
                    - laravel: '11'
                      testbench: '9'
                    - laravel: '12'
                      testbench: '10'

        name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install JS dependencies
              run: npm ci

            - name: Build editor bundle
              run: npm run build

            - name: Run JS tests
              run: npm test

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none
                  tools: composer:v2

            - name: Install Composer dependencies
              run: |
                  composer require \
                    "illuminate/support:^${{ matrix.laravel }}" \
                    "illuminate/console:^${{ matrix.laravel }}" \
                    "illuminate/view:^${{ matrix.laravel }}" \
                    "illuminate/filesystem:^${{ matrix.laravel }}" \
                    "orchestra/testbench:^${{ matrix.testbench }}" \
                    --no-interaction --no-update
                  composer update --prefer-dist --no-interaction --with-all-dependencies

            - name: Run PHP tests
              run: composer test

            - name: Run Pint
              run: vendor/bin/pint --test

            - name: Run PHPStan
              run: composer analyse

    release-smoke:
        runs-on: ubuntu-latest
        needs: tests
        if: startsWith(github.ref, 'refs/tags/') == false
        steps:
            - uses: actions/checkout@v4
            - run: echo "Matrix tests passed"
